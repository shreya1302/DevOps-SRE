apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-sre-app-v3
  labels:
    app: devops-sre-app
    version: v3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devops-sre-app
      version: v3
  template:
    metadata:
      labels:
        app: devops-sre-app
        version: v3
    spec:
      initContainers:
        - name: init-setup
          image: busybox:latest
          command:
            - sh
            - -c
            - echo "Initialization completed successfully" > /work/init-status.txt
          resources:
            requests:
              memory: "16Mi"
            limits:
              memory: "64Mi"
          volumeMounts:
            - name: init-data
              mountPath: /work
      containers:
        - name: devops-sre-app
          image: ghcr.io/shreya1302/devops-sre-app:sha-347399b663e983e72bb88f12ef5a3148674363f2
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: devops-sre-config
            - secretRef:
                name: devops-sre-secret
          volumeMounts:
            - name: init-data
              mountPath: /etc/devops-sre/init
              readOnly: true
          resources:
            requests:
              memory: "128Mi"
            limits:
              memory: "400Mi"
      volumes:
        - name: init-data
          emptyDir: {}
