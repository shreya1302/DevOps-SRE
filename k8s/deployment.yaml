
apiVersion: apps/v1
kind: Deployment

metadata:
  name: devops-sre-app
  labels:
    app: devops-sre-app

spec:
  replicas: 1

  selector:
    matchLabels:
      app: devops-sre-app

  template:
    metadata:
      labels:
        app: devops-sre-app

    spec:
      containers:
        - name: devops-sre-app
          image: ghcr.io/shreya1302/devops-sre-app:sha-a2509dbc302776e276ac0f7b2d3730abf43fa6ec
          ports:
            - containerPort: 8080
