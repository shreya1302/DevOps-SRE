
apiVersion: apps/v1
kind: Deployment

metadata:
  name: devops-sre-app
  labels:
    app: devops-sre-app

spec:
  replicas: 1

  selector:
    matchLabels:
      app: devops-sre-app

  template:
    metadata:
      labels:
        app: devops-sre-app

    spec:
      containers:
        - name: devops-sre-app
          image: ghcr.io/shreya1302/devops-sre-app:sha-347399b663e983e72bb88f12ef5a3148674363f2
          ports:
            - containerPort: 8080
