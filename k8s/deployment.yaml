
apiVersion: apps/v1
kind: Deployment

metadata:
  name: devops-sre-app
  labels:
    app: devops-sre-app

spec:
  replicas: 1

  selector:
    matchLabels:
      app: devops-sre-app

  template:
    metadata:
      labels:
        app: devops-sre-app

    spec:
      containers:
        - name: devops-sre-app
          image: ghcr.io/shreya1302/devops-sre-app:sha-61ae6e25ab67d8d66a07bfada7c219ed982fd0f3
          ports:
            - containerPort: 8080
