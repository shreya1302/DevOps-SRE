name: Release - Build and Publish to GHCR

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'k8s/deployment.yaml'

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    name: Build and Publish Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/devops-sre-app
          tags: |
            type=sha,format=long

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Update Kubernetes manifest image tag
        env:
          IMAGE_TAG: sha-${{ github.sha }}
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/devops-sre-app
        run: |
          sed -i "s|image: .*devops-sre-app:.*|image: ${IMAGE_NAME}:${IMAGE_TAG}|" k8s/deployment.yaml

      - name: Create Pull Request for manifest update
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
          branch: automation/update-k8s-image-tag
          delete-branch: true
          add-paths: k8s/deployment.yaml
          commit-message: "Update Kubernetes image tag"
          title: "Automated Kubernetes image tag update"
          body: |
            This PR was automatically created by the release workflow.

            It updates the Kubernetes deployment manifest to use the newly published Docker image.
